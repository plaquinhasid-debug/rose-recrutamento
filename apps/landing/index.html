    <meta name="description" content="Seja revendedora Rose Semi Jóias. Semijoias em consignação, sem investimento inicial." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Rose Semi Jóias — Seja Revendedora</title>
    <script>
      // Meta Pixel da Rose. O ID vem da variável de ambiente VITE_META_PIXEL_ID
      // (Vercel → Settings → Environment Variables). Sem ID, o pixel não carrega.
      (function () {
        var pixelId = "%VITE_META_PIXEL_ID%";
        if (!pixelId || pixelId.indexOf("%") === 0) return;
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', pixelId);
        fbq('track', 'PageView');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
